[[permission]]
identifier = "yood-app-commands"
description = "All custom Yood commands used by the injected UI and app pages"
commands.allow = [
  "get_system_appearance",
  "get_settings",
  "get_settings_for_ui",
  "get_app_info",
  "get_account_hints",
  "get_desktop_environment",
  "get_filter_status",
  "tracking_protection_enabled",
  "check_filter_request",
  "get_filter_script_rules",
  "inspect_url",
  "enqueue_download",
  "list_downloads",
  "pause_download",
  "resume_download",
  "cancel_download",
  "retry_download",
  "remove_download",
  "open_downloads",
  "open_download",
  "open_download_folder",
  "open_native_player",
  "open_native_player_url",
  "take_player_source",
  "open_external",
  "pick_folder",
  "resolve_media_path",
  "update_settings",
  "update_filter_lists",
  "update_ytdlp",
  "set_account_hints",
  "clear_account_hints",
]
