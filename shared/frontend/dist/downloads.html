<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yood Downloads</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #0f0f0f;
            color: #f1f1f1;
            font: 14px system-ui, sans-serif
        }

        body {
            display: flex;
            flex-direction: column
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: #212121
        }

        #head-title {
            font-weight: 600;
            flex: 1
        }

        #head-count {
            color: #aaa;
            font-size: 12px
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 8px 14px 16px
        }

        .row {
            border-bottom: 1px solid #2b2b2b;
            padding: 10px 0;
            display: flex;
            gap: 12px;
            align-items: center
        }

        .thumb {
            flex: none;
            width: 96px;
            height: 54px;
            object-fit: cover;
            border-radius: 8px;
            background: #000
        }

        .meta {
            flex: 1;
            min-width: 0
        }

        .t {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .s {
            color: #aaa;
            font-size: 12px;
            margin-top: 2px
        }

        .bar {
            height: 5px;
            background: #444;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px
        }

        .bar>i {
            display: block;
            height: 100%;
            background: #3ea6ff;
            transition: width .3s
        }

        .empty {
            color: #aaa;
            text-align: center;
            padding: 32px 0
        }

        #download-toast {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            max-width: min(360px, calc(100vw - 32px));
            padding: 12px 16px;
            border-left: 4px solid #2ecc71;
            border-radius: 8px;
            background: #292929;
            box-shadow: 0 4px 18px #000a;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-8px);
            transition: opacity .2s, transform .2s;
        }

        #download-toast.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <header><span id="head-title">Yood Downloads</span><span id="head-count"></span></header>
    <div id="download-toast" role="status" aria-live="polite"></div>
    <main>
        <div id="list">
            <div class="empty">No downloads yet</div>
        </div>
    </main>
    <script type="module" src="./downloads.js"></script>
</body>

</html>
